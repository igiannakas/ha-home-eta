[project]
name = "ha-home-eta"
version = "1.0.0"
description = "Home Assistant integration estimating when each person, and the first of them, will arrive home."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.per-file-target-version]
# The estimator core and the backtest run without Home Assistant on Python
# 3.11 or later; never rewrite them into newer syntax.
"custom_components/home_eta/core/**" = "py311"
"scripts/**" = "py311"
"tests/fixtures/**" = "py311"

[tool.ruff.lint]
select = [
    "A",    # builtins
    "ASYNC",
    "B",    # bugbear
    "BLE",  # blind except
    "C4",
    "D",    # docstrings
    "DTZ",  # naive datetimes
    "E",
    "F",
    "G",    # logging format
    "I",    # isort
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "T20",  # print
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D202",    # blank line after function docstring
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLR0911", # too many returns
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic values: thresholds are named in params.py
    "TRY003",  # long exception messages
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "SLF001", "PLC0415"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "."
